<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f4f1ec;color:#1d1c19;font-family:Arial,Helvetica,sans-serif;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">Your CozyCraft verification code is {{ .Token }}.</div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f1ec;"><tr><td align="center" style="padding:36px 16px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#ffffff;border:1px solid #e2dbd1;border-radius:24px;overflow:hidden;">
        <tr><td align="center" style="padding:34px 32px 24px;background:#eee8df;"><img src="https://www.cozycraftfurnitures.com/email-logo.png" width="230" alt="CozyCraft Furniture" style="display:block;width:230px;max-width:100%;height:auto;border:0;"></td></tr>
        <tr><td style="padding:42px 42px 36px;">
          <p style="margin:0 0 14px;color:#716c64;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;">Identity verification</p>
          <h1 style="margin:0 0 18px;color:#1d1c19;font-family:Georgia,'Times New Roman',serif;font-size:38px;line-height:1.12;font-weight:500;">Your secure code.</h1>
          <p style="margin:0 0 24px;color:#625e57;font-size:16px;line-height:1.7;">Enter this one-time code to verify your identity:</p>
          <div style="padding:20px 24px;background:#eee8df;border-radius:14px;color:#1d1c19;font-family:'Courier New',monospace;font-size:32px;font-weight:700;letter-spacing:8px;text-align:center;">{{ .Token }}</div>
        </td></tr>
        <tr><td style="padding:22px 42px;background:#1d1c19;color:#cfc8bd;font-size:12px;line-height:1.6;">This code expires shortly. CozyCraft will never ask you to share it with anyone.</td></tr>
      </table>
    </td></tr></table>
  </body>
</html>
