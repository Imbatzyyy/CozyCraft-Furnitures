<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f6f3" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Return to CozyCraft</title>
    <link rel="stylesheet" href="/mobile-payment.css" />
    <script src="/mobile-payment.js" defer></script>
  </head>
  <body>
    <main aria-labelledby="heading">
      <p class="brand">COZYCRAFT <span>FURNITURES</span></p>
      <div class="mark" aria-hidden="true">↗</div>
      <h1 id="heading">Back to your cozy place.</h1>
      <p id="message" role="status">Opening your order in the CozyCraft app.</p>
      <a id="continue" hidden>Open CozyCraft app <span aria-hidden="true">→</span></a>
      <p class="note" id="note">If your browser asks, choose Open to return to the app.</p>
      <noscript><p>Enable JavaScript for the secure app handoff, or return to CozyCraft and open My Orders. Your payment is verified separately.</p></noscript>
    </main>
  </body>
</html>
